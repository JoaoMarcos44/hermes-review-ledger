name: review-ledger
version: 1.0.2
description: Profile-local review investigations and configurable audited lessons
provides_tools:
  - ledger_open
  - ledger_status
  - ledger_run
  - ledger_record
  - ledger_recall
  - ledger_lesson
  - ledger_export
  - ledger_context
  - ledger_critic
config_schema:
  authorized_repositories:
    type: list
    default: []
    description: Explicit GitHub owner/name allowlist for this profile
  github_token_env:
    type: str
    default: REVIEW_LEDGER_GITHUB_TOKEN
    description: Name of the environment variable containing the GitHub read token
  context_budget:
    type: int
    default: 6000
    description: Maximum serialized characters of recalled lesson context (500 to 20000)
  context_enabled:
    type: bool
    default: false
    description: Opt in to the bounded context pilot and eighth model tool
  optional_skills_enabled:
    type: bool
    default: false
    description: Allow context to load operator-approved local instruction snapshots
  lesson_automation_mode:
    type: str
    default: manual
    description: Explicit automatic or manual lesson activation; local operator override takes precedence
  improvements_enabled:
    type: bool
    default: false
    description: Enable outcome diagnostics and explicit improvement proposals
  usage_enabled:
    type: bool
    default: false
    description: Measure plugin-boundary request and rendered response sizes locally
  bundle_budget:
    type: int
    default: 12000
    description: Full serialized context response character cap from 2000 to 64000

  compression_enabled:
    type: bool
    default: false
    description: Allow explicit compact/reference context views; legacy full remains default
  bundle_byte_budget:
    type: int
    default: 256000
    description: Full UTF-8 response cap for opt-in projections, from 2000 to 256000
  bundle_token_budget:
    type: int
    default: 64000
    description: Optional projection token ceiling from 1 to 256000; unverified without a prepared local counter
  critic_enabled:
    type: bool
    default: false
    description: Opt-in critic; does not grant host permissions or prove an authorized route
  critic_authorized_repositories:
    type: list
    default: []
    description: Explicit repository consent for sending the bounded critic packet
  critic_provider:
    type: str
    default: ""
    description: Operator-selected requested provider; no model-supplied override
  critic_model:
    type: str
    default: ""
    description: Operator-selected requested model; never silently use the main model
  critic_max_input_chars:
    type: int
    default: 18000
    description: Maximum complete serialized packet characters; no silent premise truncation
  critic_max_output_tokens:
    type: int
    default: 2000
    description: Requested output token cap
  critic_timeout_seconds:
    type: int
    default: 60
    description: Local timeout budget; not a remote cancellation guarantee
  critic_max_calls_per_run:
    type: int
    default: 3
    description: Persisted logical-attempt budget per review run
